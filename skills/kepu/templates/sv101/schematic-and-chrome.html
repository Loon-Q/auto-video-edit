<!--
  SV101 Standard Template 3 (V5.1 Upgraded): Episode Chrome, Era Node Tree & Silky Transitions
  Includes the 4 core structural patterns defined in V5.1 visual-system.md:
    1. Silky 0.40s Optical De-Blur Chapter Entry + Outgoing Push-Blur Seam (#seam-stage, ZERO black gap!)
    2. 130-Year / Multi-Milestone Era Node Tree (#sv-era-tree, top-right coordinate map)
    3. 4:6 Host Bullet Split (used at most ONCE per episode when host lists 1-2-3 points)
    4. Constant Full-Episode 42px Bottom Chapter Bar (Frame 0 -> Final Frame) + Punctuation-Free Subtitle
-->
<template>
  <style>
    .sv-split-46 { position: absolute; inset: 0; background: #14161b; }
    .sv-split-left {
      position: absolute; left: 0; top: 0; bottom: 0; width: 768px;
      background: #14161b;
      display: flex; flex-direction: column; justify-content: center;
      padding: 0 64px; gap: 64px; z-index: 4;
    }
    .sv-bullet-row { display: flex; align-items: center; gap: 22px; opacity: 0; }
    .sv-bullet-sq { width: 18px; height: 18px; background: #ffa800; flex-shrink: 0; }
    .sv-bullet-txt {
      font-family: CangEr, sans-serif; font-size: 68px; line-height: 1.05;
      color: #ffffff; white-space: nowrap; text-shadow: none !important;
    }
    .sv-split-right {
      position: absolute; left: 768px; top: 0; bottom: 0; width: 1152px; overflow: hidden; z-index: 3;
    }
    .sv-split-right video { width: 100%; height: 100%; object-fit: cover; }

    /* Opaque Schematic Pills (z-index > SVG so connector lines NEVER strike through text!) */
    .tree-pill {
      position: absolute; padding: 14px 24px; border-radius: 12px;
      background: #171a22; border: 1.5px solid rgba(255,255,255,0.22);
      font-family: Sans, sans-serif; font-size: 25px; font-weight: 600;
      color: rgba(255,255,255,0.86); white-space: nowrap; z-index: 15;
    }
    .tree-pill.is-ok { border-color: #ffa800; background: #241e12; color: #ffd074; }
    .tree-pill.is-bad-q { border-color: #ff3b30; background: #261416; color: #ff867f; }
  </style>

  <div id="sv-chrome-demo" data-hf-id="sv-chrome-demo" data-width="1920" data-height="1080">
    <div id="seam-stage">
      <!-- 1. Silky Incoming Chapter Card (0.00 - 3.00s, ZERO black lead-in!) -->
      <div id="sv-ch1-layer" class="sv-layer is-initial" style="background:#0e0f12;">
        <video id="sv-ch1-bg" class="ch-card-bg" data-hf-id="v-ch1-bg" data-start="0" data-duration="3.05" src="assets/ch1_bg.mp4" muted playsinline></video>
        <div id="sv-ch1-txt" class="ch-card-text">
          <div class="ch-card-no">第一章</div>
          <div class="ch-card-title">背了130年的台词</div>
        </div>
      </div>

      <!-- 2. 4:6 Host Bullet Layer -->
      <div id="sv-46-layer" class="sv-layer sv-split-46">
        <div class="sv-split-left">
          <div id="sv-b1" class="sv-bullet-row"><span class="sv-bullet-sq"></span><span class="sv-bullet-txt">家长看得到记录</span></div>
          <div id="sv-b2" class="sv-bullet-row"><span class="sv-bullet-sq"></span><span class="sv-bullet-txt">出口前一键拦截</span></div>
          <div id="sv-b3" class="sv-bullet-row"><span class="sv-bullet-sq"></span><span class="sv-bullet-txt">低成本切换配音</span></div>
        </div>
        <div class="sv-split-right">
          <video id="v-host-123" data-hf-id="v-host-123" data-start="3.00" data-duration="11.00" src="assets/host_123.mp4" muted playsinline></video>
        </div>
      </div>

      <!-- 3. 130-Year Era Node Tree -->
      <div id="sv-era-tree">
        <div class="era-rail-bg"></div>
        <div id="era-rail-fill"></div>
        <div class="era-nodes-row">
          <div class="era-node is-current"><div class="era-dot"></div><div class="era-yr">1890</div><div class="era-tag">微缩留声机</div></div>
          <div class="era-node"><div class="era-dot"></div><div class="era-yr">1960</div><div class="era-tag">拉绳唱片</div></div>
          <div class="era-node"><div class="era-dot"></div><div class="era-yr">1985</div><div class="era-tag">双轨磁带</div></div>
          <div class="era-node"><div class="era-dot"></div><div class="era-yr">1998</div><div class="era-tag">传感器计数</div></div>
          <div class="era-node"><div class="era-dot"></div><div class="era-yr">2015</div><div class="era-tag">云端分支树</div></div>
          <div class="era-node"><div class="era-dot"></div><div class="era-yr">2022</div><div class="era-tag">大模型破局</div></div>
        </div>
      </div>
    </div>

    <!-- 4. Constant Full-Episode 42px Bottom Chapter Bar (Pinned OUTSIDE #seam-stage so it stays rock-steady!) -->
    <div id="sv-chapter-bar">
      <div id="sv-chapter-progress"></div>
      <div class="sv-ch-item is-intro">导语</div>
      <div class="sv-ch-item is-active">背了130年的台词</div>
      <div class="sv-ch-item">剧本被撕了</div>
      <div class="sv-ch-item">肚子里的传声筒</div>
      <div class="sv-ch-item">尾声</div>
    </div>

    <!-- 风雅宋 Punctuation-Free Subtitle -->
    <div id="sv-subtitle"></div>
  </div>

  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });

      // Continuous episode progress bar
      tl.fromTo('#sv-chapter-progress', { width: '9.5%' }, { width: '33.2%', duration: 14.0, ease: 'none' }, 0.00);

      // Silky Seam In + Chapter Card (0.00 - 3.00)
      tl.fromTo('#sv-ch1-bg', { scale: 1.10, filter: 'blur(12px) brightness(0.30)' }, { scale: 1.03, filter: 'blur(0px) brightness(0.38)', duration: 0.45, ease: 'power2.out' }, 0.00);
      tl.to('#sv-ch1-bg', { scale: 1.07, duration: 2.55, ease: 'none' }, 0.45);
      tl.fromTo('#sv-ch1-txt', { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.32, ease: 'power3.out' }, 0.12);
      tl.set('#sv-ch1-layer', { opacity: 0, visibility: 'hidden' }, 3.00);

      // 4:6 Host Bullet progressive reveal (pure GPU x/opacity transforms)
      tl.set('#sv-46-layer', { visibility: 'visible', opacity: 1 }, 3.00);
      tl.fromTo('#sv-b1', { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.24, ease: 'power3.out' }, 3.30);
      tl.fromTo('#sv-b2', { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.24, ease: 'power3.out' }, 6.20);
      tl.fromTo('#sv-b3', { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.24, ease: 'power3.out' }, 9.10);

      // Silky Seam Out (last 0.40s = 12 frames before xfade into next chapter)
      tl.to('#seam-stage', { scale: 1.10, filter: 'blur(14px) brightness(0.36)', duration: 0.40, ease: 'power2.in' }, 13.60);

      window.__timelines = window.__timelines || {};
      window.__timelines['sv101-chrome-demo'] = tl;
    })();
  </script>
</template>
