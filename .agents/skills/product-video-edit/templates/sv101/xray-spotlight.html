<!--
  SV101 Standard Template 1: Real-Photo X-Ray Magnifier Loupe (对标《1nm》光刻机渐进点亮拆解)
  Usage:
    - Replace `IMG_SRC` with a real macro/product/PCB frame (1920x1080).
    - Configure `SPOTS` array in script: { id, cx, cy, r, label, labelSide, at }
      where `at` is the exact spoken keyword timestamp (in seconds).
    - Base image is dimmed & desaturated; each circular loupe reveals the crisp, slightly
      magnified (1.12x) original pixels inside a soft glowing ring, dimming prior loupes to 0.42.
-->
<template>
  <style>
    .xr-stage { position: absolute; inset: 0; overflow: hidden; background: #0e0f12; }
    .xr-base-img {
      position: absolute; inset: 0; width: 1920px; height: 1080px; object-fit: cover;
      filter: grayscale(0.76) brightness(0.42) contrast(1.06) blur(2px);
      transform-origin: 50% 50%;
    }
    .xr-spot {
      position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
      opacity: 0; pointer-events: none;
    }
    .xr-lens {
      position: absolute; overflow: hidden; border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.88);
      box-shadow:
        0 0 32px rgba(255, 168, 0, 0.28),
        0 12px 36px rgba(0, 0, 0, 0.72),
        inset 0 0 18px rgba(255, 255, 255, 0.30);
    }
    .xr-lens-img {
      position: absolute; width: 1920px; height: 1080px; object-fit: cover;
      filter: brightness(1.14) contrast(1.12) saturate(1.05);
    }
    .xr-label {
      position: absolute;
      font-family: CangEr, sans-serif;
      font-size: 76px;
      line-height: 1.0;
      color: #ffffff;
      white-space: nowrap;
      text-shadow: 0 10px 28px rgba(0, 0, 0, 0.92);
    }
    .xr-label.is-hero {
      font-size: 96px;
      color: #ffa800;
    }
  </style>

  <div id="xr-root" class="xr-stage" data-hf-id="xr-root" data-width="1920" data-height="1080">
    <img id="xr-base" class="xr-base-img" src="assets/pcb_macro_1080p.jpg" alt="">
    <div id="xr-spots-mount"></div>
  </div>

  <script>
    (() => {
      const IMG_SRC = document.getElementById('xr-base').getAttribute('src');
      // Example progressive spots synced to spoken keywords (1.5-2.5s cadence):
      const SPOTS = [
        { cx: 980, cy: 470, r: 125, label: 'ESP32', hero: true, side: 'right', at: 1.20 },
        { cx: 760, cy: 360, r: 95,  label: '麦克风', hero: false, side: 'left',  at: 3.40 },
        { cx: 1150, cy: 640, r: 105, label: '小喇叭', hero: false, side: 'right', at: 5.10 },
        { cx: 880, cy: 710, r: 110, label: '电池',   hero: false, side: 'left',  at: 6.80 },
      ];

      const mount = document.getElementById('xr-spots-mount');
      const tl = gsap.timeline({ paused: true });
      gsap.fromTo('#xr-base', { scale: 1.0 }, { scale: 1.03, duration: 12.0, ease: 'none' }, 0);

      SPOTS.forEach((s, idx) => {
        const wrap = document.createElement('div');
        wrap.className = 'xr-spot';
        wrap.id = `xr-spot-${idx}`;

        const d = s.r * 2;
        const lens = document.createElement('div');
        lens.className = 'xr-lens';
        lens.style.left = `${s.cx - s.r}px`;
        lens.style.top = `${s.cy - s.r}px`;
        lens.style.width = `${d}px`;
        lens.style.height = `${d}px`;

        const innerImg = document.createElement('img');
        innerImg.className = 'xr-lens-img';
        innerImg.src = IMG_SRC;
        innerImg.style.left = `${-(s.cx - s.r)}px`;
        innerImg.style.top = `${-(s.cy - s.r)}px`;
        innerImg.style.transformOrigin = `${s.cx}px ${s.cy}px`;
        innerImg.style.transform = 'scale(1.12)';
        lens.appendChild(innerImg);

        const lbl = document.createElement('div');
        lbl.className = 'xr-label' + (s.hero ? ' is-hero' : '');
        lbl.textContent = s.label;
        lbl.style.top = `${s.cy - (s.hero ? 48 : 38)}px`;
        if (s.side === 'left') {
          lbl.style.left = `${s.cx - s.r - 24}px`;
          lbl.style.transform = 'translateX(-100%)';
        } else {
          lbl.style.left = `${s.cx + s.r + 24}px`;
        }

        wrap.appendChild(lens);
        wrap.appendChild(lbl);
        mount.appendChild(wrap);

        gsap.set(wrap, { transformOrigin: `${s.cx}px ${s.cy}px` });
        tl.fromTo(
          wrap,
          { opacity: 0, scale: 0.88 },
          { opacity: 1, scale: 1.0, duration: 0.28, ease: 'power3.out' },
          s.at
        );
        if (idx > 0) {
          tl.to(`#xr-spot-${idx - 1}`, { opacity: 0.42, duration: 0.24, ease: 'power2.out' }, s.at);
        }
      });

      window.__timelines = window.__timelines || {};
      window.__timelines['sv101-xray-spotlight'] = tl;
    })();
  </script>
</template>
